<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Victor Hugo — Agentes de IA, Memória Empresarial e Sites de Alta Performance">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="#0a0a0a"/>
  <rect width="1280" height="360" fill="url(#dots)"/>

  <!-- frame hairlines -->
  <line x1="0" y1="0.5" x2="1280" y2="0.5" stroke="#ffffff" stroke-opacity="0.08"/>
  <line x1="0" y1="359.5" x2="1280" y2="359.5" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- corner ticks (editorial frame) -->
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2">
    <path d="M40 28 H64 M40 28 V52"/>
    <path d="M1240 28 H1216 M1240 28 V52"/>
    <path d="M40 332 H64 M40 332 V308"/>
    <path d="M1240 332 H1216 M1240 332 V308"/>
  </g>

  <!-- eyebrow -->
  <text x="640" y="92" text-anchor="middle" font-family="'SF Mono','JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" letter-spacing="6" fill="#ffffff" fill-opacity="0.34">FACTO VISUAL — SOLO BUILDER</text>

  <!-- wordmark -->
  <text x="640" y="196" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="86" font-weight="800" letter-spacing="3" fill="#ffffff">VICTOR HUGO</text>

  <!-- divider -->
  <line x1="592" y1="228" x2="688" y2="228" stroke="#ffffff" stroke-opacity="0.30" stroke-width="1.4"/>

  <!-- subtitle -->
  <text x="640" y="280" text-anchor="middle" font-family="'SF Mono','JetBrains Mono',ui-monospace,Menlo,monospace" font-size="15" letter-spacing="4" fill="#ffffff" fill-opacity="0.62">AGENTES DE IA · MEMÓRIA EMPRESARIAL · SITES DE ALTA PERFORMANCE</text>
</svg>
